name: Verify Fulcrum

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  evidence:
    name: Paper evidence and replication
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - run: python research/verify_evidence.py
      - run: python -m pip install -r research/requirements.txt
      - run: python research/reproduce.py

  dashboard:
    name: Legacy dashboard tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm test
